<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow4" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="510" y="38" text-anchor="middle" font-size="30" font-weight="bold" fill="#000000">Парадигмы машинного обучения</text>

  <!-- Колонка 1 -->
  <rect x="20" y="60" width="310" height="420" rx="12" fill="#f0f0f0" stroke="#000000" stroke-width="3.5" filter="url(#shadow4)"/>
  <rect x="20" y="60" width="310" height="55" rx="12" fill="#555555"/>
  <rect x="20" y="103" width="310" height="12" fill="#555555"/>
  <text x="175" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">С УЧИТЕЛЕМ</text>
  <text x="175" y="135" text-anchor="middle" font-size="17" fill="#000000">(Supervised Learning)</text>
  <text x="40" y="172" font-size="16" fill="#000000">Есть размеченные данные</text>
  <text x="40" y="198" font-size="16" fill="#000000">(X → y)</text>
  <line x1="40" y1="216" x2="310" y2="216" stroke="#cccccc" stroke-width="2"/>
  <text x="40" y="248" font-size="19" font-weight="bold" fill="#000000">Задачи:</text>
  <text x="40" y="278" font-size="16" fill="#000000">• Классификация</text>
  <text x="40" y="308" font-size="16" fill="#000000">• Регрессия</text>
  <line x1="40" y1="330" x2="310" y2="330" stroke="#cccccc" stroke-width="2"/>
  <text x="40" y="362" font-size="19" font-weight="bold" fill="#000000">Алгоритмы:</text>
  <text x="40" y="392" font-size="15" fill="#000000">• Линейная регрессия</text>
  <text x="40" y="418" font-size="15" fill="#000000">• Логистическая регрессия</text>
  <text x="40" y="444" font-size="15" fill="#000000">• Деревья решений</text>
  <text x="40" y="470" font-size="15" fill="#000000">• Нейронные сети</text>

  <!-- Колонка 2 -->
  <rect x="355" y="60" width="310" height="420" rx="12" fill="#f0f0f0" stroke="#000000" stroke-width="3.5" filter="url(#shadow4)"/>
  <rect x="355" y="60" width="310" height="55" rx="12" fill="#777777"/>
  <rect x="355" y="103" width="310" height="12" fill="#777777"/>
  <text x="510" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">БЕЗ УЧИТЕЛЯ</text>
  <text x="510" y="135" text-anchor="middle" font-size="17" fill="#000000">(Unsupervised Learning)</text>
  <text x="375" y="172" font-size="16" fill="#000000">Нет размеченных данных</text>
  <text x="375" y="198" font-size="16" fill="#000000">(только X)</text>
  <line x1="375" y1="216" x2="645" y2="216" stroke="#cccccc" stroke-width="2"/>
  <text x="375" y="248" font-size="19" font-weight="bold" fill="#000000">Задачи:</text>
  <text x="375" y="278" font-size="16" fill="#000000">• Кластеризация</text>
  <text x="375" y="308" font-size="16" fill="#000000">• Снижение размерности</text>
  <text x="375" y="338" font-size="16" fill="#000000">• Поиск аномалий</text>
  <line x1="375" y1="360" x2="645" y2="360" stroke="#cccccc" stroke-width="2"/>
  <text x="375" y="392" font-size="19" font-weight="bold" fill="#000000">Алгоритмы:</text>
  <text x="375" y="418" font-size="15" fill="#000000">• K-means</text>
  <text x="375" y="444" font-size="15" fill="#000000">• Иерархическая кластеризация</text>
  <text x="375" y="470" font-size="15" fill="#000000">• PCA</text>

  <!-- Колонка 3 -->
  <rect x="690" y="60" width="310" height="420" rx="12" fill="#f0f0f0" stroke="#000000" stroke-width="3.5" filter="url(#shadow4)"/>
  <rect x="690" y="60" width="310" height="55" rx="12" fill="#999999"/>
  <rect x="690" y="103" width="310" height="12" fill="#999999"/>
  <text x="845" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">С ПОДКРЕПЛЕНИЕМ</text>
  <text x="845" y="135" text-anchor="middle" font-size="17" fill="#000000">(Reinforcement Learning)</text>
  <text x="710" y="172" font-size="16" fill="#000000">Агент учится через</text>
  <text x="710" y="198" font-size="16" fill="#000000">взаимодействие со средой</text>
  <line x1="710" y1="216" x2="980" y2="216" stroke="#cccccc" stroke-width="2"/>
  <text x="710" y="248" font-size="19" font-weight="bold" fill="#000000">Задачи:</text>
  <text x="710" y="278" font-size="16" fill="#000000">• Оптимизация стратегий</text>
  <text x="710" y="308" font-size="16" fill="#000000">• Управление</text>
  <text x="710" y="338" font-size="16" fill="#000000">• Робототехника</text>
  <line x1="710" y1="360" x2="980" y2="360" stroke="#cccccc" stroke-width="2"/>
  <text x="710" y="392" font-size="19" font-weight="bold" fill="#000000">Алгоритмы:</text>
  <text x="710" y="418" font-size="15" fill="#000000">• Q-learning</text>
  <text x="710" y="444" font-size="15" fill="#000000">• DQN</text>
  <text x="710" y="470" font-size="15" fill="#000000">• A3C</text>
</svg>