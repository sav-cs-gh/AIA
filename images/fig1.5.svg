  <text x="690" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">МОДЕЛИРОВАНИЕ</text>
  <text x="593" y="165" font-size="15" fill="#000000">• ML модели</text>
  <text x="593" y="195" font-size="15" fill="#000000">• LLM / GenAI</text>
  <text x="593" y="225" font-size="15" fill="#000000">• Мультимодальный анализ</text>
  <text x="593" y="255" font-size="15" fill="#000000">• Причинно-следственный</text>
  <text x="593" y="285" font-size="15" fill="#000000">• Сценарное моделирование</text>

  <!-- Стрелка 3→4 -->
  <polygon points="810,200 845,185 845,215" fill="#888888"/>
  <line x1="800" y1="200" x2="835" y2="200" stroke="#888888" stroke-width="4"/>

