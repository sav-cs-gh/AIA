  <text x="940" y="103" text-anchor="middle" font-size="19" font-weight="bold" fill="#000000">ПОДДЕРЖКА</text>
  <text x="940" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">РЕШЕНИЙ</text>
