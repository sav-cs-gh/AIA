  <text x="870" y="195" font-size="16" fill="#000000">• Рекомендации</text>
  <text x="870" y="225" font-size="16" fill="#000000">• Сценарии</text>
  <text x="870" y="255" font-size="16" fill="#000000">• Объяснения</text>
  <text x="870" y="285" font-size="16" fill="#000000">• Визуализация</text>

  <!-- Обратная связь -->
  <line x1="940" y1="320" x2="940" y2="355" stroke="#000000" stroke-width="2.5" stroke-dasharray="10,5"/>
  <line x1="940" y1="355" x2="150" y2="355" stroke="#000000" stroke-width="2.5" stroke-dasharray="10,5"/>
  <polygon points="138,355 150,349 150,361" fill="#000000"/>
  <text x="530" y="375" text-anchor="middle" font-size="16" fill="#000000">◄ Обратная связь и дообучение моделей ►</text>
