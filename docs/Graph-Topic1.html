  [42,61,'#a855f7',''],[42,62,'#a855f7',''],

  [63,64,'#ff9800',''],
  [64,65,'#ff9800',''],[64,66,'#ff9800',''],
  [64,67,'#ff9800',''],[64,68,'#ff9800',''],

  [31,63,'#a855f7','со-бытие'],

  [76,31,'#607d8b',''],[77,31,'#607d8b',''],
  [78,31,'#607d8b',''],[79,31,'#607d8b',''],[80,31,'#607d8b',''],

  [70,63,'#9c27b0',''],[71,63,'#9c27b0',''],
];

// ============== КОНФИГ РАЗМЕТКИ ==============
const NODE_X = 108;
const NODE_Y = 80;
const NODE_R = 13;
const CAT_HEADER = 50;
const SUB_LABEL_H = 25;
const SUBS_GAP = 5;
const CAT_PAD_BOTTOM = 12;

// Колонки сдвинуты вплотную; y пересчитаны с зазором ~15 px
const LAYOUT_SPEC = [
  { id:'diag',       colX:30,   colW:600, y:140,  maxCols:4 },
  { id:'trends',     colX:30,   colW:600, y:327,  maxCols:5 },
  { id:'methods',    colX:30,   colW:600, y:594,  maxCols:4 },
  { id:'exis',       colX:650,  colW:500, y:140,  maxCols:4 },
  { id:'progs',      colX:650,  colW:500, y:1007, maxCols:2 },
  { id:'diag2',      colX:650,  colW:500, y:1194, maxCols:4 },
  { id:'strategies', colX:1170, colW:500, y:140,  maxCols:3 },
  { id:'ethnic',     colX:1170, colW:500, y:547,  maxCols:4 },
  { id:'instr',      colX:1170, colW:500, y:844,  maxCols:4 },
  { id:'persons',    colX:1170, colW:500, y:1141, maxCols:2 },
];

const TOTAL_W = 1700;   // было 2230 — правая пустота убрана
const TOTAL_H = 1600;
const TOP = 140;

// ============== ПРЕДРАСЧЁТ ==============
const NODES = {};
const NODE_LIST = [];

CATEGORIES.forEach(cat => {
  cat.subs.forEach(sub => {
    sub.nodes.forEach(n => {
      NODES[n.num] = { ...n, category: cat, subcategory: sub, id: 'n' + n.num };
      NODE_LIST.push(NODES[n.num]);
    });
  });
});

const CAT_LAYOUT = {};
LAYOUT_SPEC.forEach(spec => {
  const cat = CATEGORIES.find(c => c.id === spec.id);
  if (!cat) return;

  let innerH = 0;
  const subYs = [];
  cat.subs.forEach(sub => {
    const rows = Math.ceil(sub.nodes.length / spec.maxCols);
    const subH = SUB_LABEL_H + rows * NODE_Y;
    subYs.push({ sub, y: innerH, h: subH, rows });
    innerH += subH + SUBS_GAP;
  });
  const catH = CAT_HEADER + innerH + CAT_PAD_BOTTOM;

  let maxRowNodes = 0;
  cat.subs.forEach(sub => {
    for (let r = 0; r < Math.ceil(sub.nodes.length / spec.maxCols); r++) {
      const inRow = Math.min(spec.maxCols, sub.nodes.length - r * spec.maxCols);
      if (inRow > maxRowNodes) maxRowNodes = inRow;
    }
  });
  const catW = maxRowNodes * NODE_X + 40;

  const catX = spec.colX + (spec.colW - catW) / 2;

  CAT_LAYOUT[cat.id] = { x: catX, y: spec.y, w: catW, h: catH };

  subYs.forEach(({ sub, y: subY, rows }) => {
    const N = sub.nodes.length;
    for (let r = 0; r < rows; r++) {
      const start = r * spec.maxCols;
      const end = Math.min(start + spec.maxCols, N);
      const inRow = end - start;
      const rowW = (inRow - 1) * NODE_X;
      const startX = catX + catW / 2 - rowW / 2;
      for (let c = 0; c < inRow; c++) {
        const node = NODES[sub.nodes[start + c].num];
        node.x = startX + c * NODE_X;
        node.y = spec.y + CAT_HEADER + subY + SUB_LABEL_H + r * NODE_Y + NODE_Y / 2 - 10;
        node.r = NODE_R;
      }
    }
  });
});

// ============== РЕНДЕРИНГ ==============
const NS = 'http://www.w3.org/2000/svg';
const tooltip = document.getElementById('tooltip');
let pinnedNode = null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function wrapLabel(text, max) {
  if (text.length <= max) return [text];
  const words = text.split(' '); const lines = []; let cur = '';
  words.forEach(w => {
    if ((cur + ' ' + w).trim().length <= max) cur = (cur + ' ' + w).trim();
    else { if (cur) lines.push(cur); cur = w; }
  });
  if (cur) lines.push(cur);
  return lines.slice(0, 3);
}

function render() {
  const svg = document.getElementById('graph');
  svg.setAttribute('width', TOTAL_W);
  svg.setAttribute('height', TOTAL_H);
  svg.setAttribute('viewBox', `0 0 ${TOTAL_W} ${TOTAL_H}`);

  const defs = document.createElementNS(NS, 'defs');
  const grad = document.createElementNS(NS, 'linearGradient');
  grad.setAttribute('id', 'titleGradient');
  grad.setAttribute('x1', '0%'); grad.setAttribute('x2', '100%');
  [['0%','#5b8def','0'],['20%','#8ab4f8','1'],['50%','#ffffff','1'],
   ['80%','#8ab4f8','1'],['100%','#5b8def','0']].forEach(([off, col, op]) => {
    const s = document.createElementNS(NS, 'stop');
    s.setAttribute('offset', off); s.setAttribute('stop-color', col); s.setAttribute('stop-opacity', op);
    grad.appendChild(s);
  });
  defs.appendChild(grad); svg.appendChild(defs);

  const titleG = document.createElementNS(NS, 'g');
  const addText = (cls, y, text) => {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', cls); t.setAttribute('x', TOTAL_W / 2); t.setAttribute('y', y);
    t.textContent = text; return t;
  };
  titleG.appendChild(addText('main-subtitle', 32, 'ИНТЕРАКТИВНЫЙ ГРАФ СВЯЗЕЙ · «ОБРАЗОВАНИЕ В ПОТОКЕ ПЕРЕМЕН»'));
  titleG.appendChild(addText('main-title', 66, 'Методологические ориентиры и тенденции'));
  const divider = document.createElementNS(NS, 'line');
  divider.setAttribute('class', 'title-line');
  divider.setAttribute('x1', TOTAL_W * 0.18); divider.setAttribute('x2', TOTAL_W * 0.82);
  divider.setAttribute('y1', 84); divider.setAttribute('y2', 84);
  titleG.appendChild(divider);
  titleG.appendChild(addText('main-legend', 104,
    NODE_LIST.length + ' понятий · ' + CATEGORIES.length + ' категорий · ' +
    CATEGORIES.reduce((s,c) => s + c.subs.length, 0) + ' подкатегорий · ' +
    EDGES_RAW.length + ' связей'));
  svg.appendChild(titleG);

  CATEGORIES.forEach(cat => {
    const L = CAT_LAYOUT[cat.id];
    if (!L) return;
    const g = document.createElementNS(NS, 'g');

    const bg = document.createElementNS(NS, 'rect');
    bg.setAttribute('x', L.x); bg.setAttribute('y', L.y);
    bg.setAttribute('width', L.w); bg.setAttribute('height', L.h);
    bg.setAttribute('rx', 14); bg.setAttribute('fill', cat.color);
    bg.setAttribute('class', 'category-panel'); bg.setAttribute('stroke', cat.color);
    g.appendChild(bg);

    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', L.x + 18); t.setAttribute('y', L.y + 32);
    t.setAttribute('class', 'cat-label'); t.setAttribute('fill', cat.color);
    t.textContent = cat.name; g.appendChild(t);

    const cnt = cat.subs.reduce((s, sub) => s + sub.nodes.length, 0);
    const ce = document.createElementNS(NS, 'text');
    ce.setAttribute('x', L.x + L.w - 18); ce.setAttribute('y', L.y + 32);
    ce.setAttribute('class', 'cat-count'); ce.setAttribute('fill', cat.color);
    ce.setAttribute('text-anchor', 'end');
    ce.textContent = cnt + ' узлов'; g.appendChild(ce);

    svg.appendChild(g);

    let innerY = 0;
    cat.subs.forEach(sub => {
      const rows = Math.ceil(sub.nodes.length / (LAYOUT_SPEC.find(s => s.id === cat.id)?.maxCols || 4));
      const subH = SUB_LABEL_H + rows * NODE_Y;
      const sg = document.createElementNS(NS, 'g');

      const sBG = document.createElementNS(NS, 'rect');
      sBG.setAttribute('x', L.x + 10); sBG.setAttribute('y', L.y + CAT_HEADER + innerY);
      sBG.setAttribute('width', L.w - 20); sBG.setAttribute('height', subH);
      sBG.setAttribute('rx', 8); sBG.setAttribute('fill', cat.color);
      sBG.setAttribute('class', 'sub-zone'); sBG.setAttribute('stroke', cat.color);
      sg.appendChild(sBG);

      const st = document.createElementNS(NS, 'text');
      st.setAttribute('x', L.x + 22); st.setAttribute('y', L.y + CAT_HEADER + innerY + 18);
      st.setAttribute('class', 'sub-label'); st.setAttribute('fill', cat.color);
      st.textContent = sub.name; sg.appendChild(st);

      svg.appendChild(sg);

      innerY += subH + SUBS_GAP;
    });
  });

  const edgesG = document.createElementNS(NS, 'g');
  const edgeEls = [], edgeLabelEls = [];

  EDGES_RAW.forEach(([fromNum, toNum, color, label]) => {
    const a = NODES[fromNum], b = NODES[toNum];
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const ux = dx/dist, uy = dy/dist;
    const x1 = a.x + ux*a.r, y1 = a.y + uy*a.r;
    const x2 = b.x - ux*b.r, y2 = b.y - uy*b.r;
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    const off = 0.10 * dist;
    const cx = mx - uy*off, cy = my + ux*off;

    const path = document.createElementNS(NS, 'path');
    path.setAttribute('class', 'edge');
    path.setAttribute('d', `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);
    path.setAttribute('stroke', color);
    path.dataset.from = a.id; path.dataset.to = b.id;
    edgesG.appendChild(path); edgeEls.push(path);

    if (label) {
      const t = 0.5;
      const lx = (1-t)*(1-t)*x1 + 2*(1-t)*t*cx + t*t*x2;
      const ly = (1-t)*(1-t)*y1 + 2*(1-t)*t*cy + t*t*y2;
      const txt = document.createElementNS(NS, 'text');
      txt.setAttribute('class', 'edge-label');
      txt.setAttribute('x', lx); txt.setAttribute('y', ly - 2);
      txt.setAttribute('fill', color); txt.textContent = label;
      txt.dataset.from = a.id; txt.dataset.to = b.id;
      edgesG.appendChild(txt); edgeLabelEls.push(txt);
    }
  });
  svg.appendChild(edgesG);

  const nodesG = document.createElementNS(NS, 'g');
  const nodeEls = [];

  NODE_LIST.forEach(n => {
    const cat = n.category;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'node-group'); g.dataset.id = n.id;

    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('class', 'node-circle');
    circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y);
    circle.setAttribute('r', n.r); circle.setAttribute('fill', cat.color);
    circle.style.color = cat.color;
    g.appendChild(circle);

    const label = document.createElementNS(NS, 'text');
    label.setAttribute('class', 'node-label');
    label.setAttribute('x', n.x); label.setAttribute('y', n.y + n.r + 11);
    const lines = wrapLabel(n.title, 18);
    lines.forEach((ln, i) => {
      const tspan = document.createElementNS(NS, 'tspan');
      tspan.setAttribute('x', n.x); tspan.setAttribute('dy', i === 0 ? 0 : 11);
      tspan.textContent = ln; label.appendChild(tspan);
    });
    g.appendChild(label);

    g.addEventListener('mouseenter', evt => {
      if (!pinnedNode) highlightNode(n.id, edgeEls, edgeLabelEls, nodeEls);
      showTooltip(n, evt);
    });
    g.addEventListener('mousemove', moveTooltip);
    g.addEventListener('mouseleave', () => {
      if (!pinnedNode) { clearHighlight(edgeEls, edgeLabelEls, nodeEls); hideTooltip(); }
    });
    g.addEventListener('click', evt => {
      evt.stopPropagation();
      if (pinnedNode && pinnedNode.id === n.id) {
        pinnedNode = null;
        clearHighlight(edgeEls, edgeLabelEls, nodeEls);
        tooltip.classList.remove('visible');
      } else {
        pinnedNode = n;
        highlightNode(n.id, edgeEls, edgeLabelEls, nodeEls);
        showTooltip(n, { clientX: evt.clientX, clientY: evt.clientY }, true);
      }
    });

    nodesG.appendChild(g);
    nodeEls.push({ id: n.id, g, circle });
  });
  svg.appendChild(nodesG);
}

function highlightNode(id, edgeEls, edgeLabelEls, nodeEls) {
  const conn = new Set([id]);
  edgeEls.forEach(el => {
    if (el.dataset.from === id || el.dataset.to === id) {
      el.classList.add('hi'); el.classList.remove('dim');
      conn.add(el.dataset.from); conn.add(el.dataset.to);
    } else { el.classList.add('dim'); el.classList.remove('hi'); }
  });
  edgeLabelEls.forEach(el => {
    if (el.dataset.from === id || el.dataset.to === id) {
      el.classList.add('hi'); el.classList.remove('dim');
    } else { el.classList.add('dim'); el.classList.remove('hi'); }
  });
  nodeEls.forEach(ne => {
    if (conn.has(ne.id)) { ne.circle.classList.remove('dim'); ne.g.classList.remove('dim'); }
    else { ne.circle.classList.add('dim'); ne.g.classList.add('dim'); }
  });
}
function clearHighlight(edgeEls, edgeLabelEls, nodeEls) {
  edgeEls.forEach(el => el.classList.remove('hi','dim'));
  edgeLabelEls.forEach(el => el.classList.remove('hi','dim'));
  nodeEls.forEach(ne => {
    ne.circle.classList.remove('dim','active');
    ne.g.classList.remove('dim');
  });
}
function showTooltip(n, evt, isPinned) {
  const desc = DESCRIPTIONS[n.num] || '';
  tooltip.innerHTML = `
    <h4>${escapeHtml(n.title)}</h4>
    <div class="tt-sub" style="color:${n.category.color}">${escapeHtml(n.category.name.replace(/^[^\s]+\s/, ''))} · ${escapeHtml(n.subcategory.name)}</div>
    <div class="tt-desc">${escapeHtml(desc)}</div>
    <div class="tt-hint">${isPinned ? 'Кликните ещё раз, чтобы открепить' : 'Кликните, чтобы закрепить →'}</div>
  `;
  tooltip.classList.add('visible');
  moveTooltip(evt);
}
function moveTooltip(evt) {
  const pad = 16;
  const w = tooltip.offsetWidth, h = tooltip.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > window.innerWidth - 8)  x = evt.clientX - w - pad;
  if (y + h > window.innerHeight - 8) y = evt.clientY - h - pad;
  tooltip.style.left = Math.max(8, x) + 'px';
  tooltip.style.top  = Math.max(8, y) + 'px';
}
function hideTooltip() { if (!pinnedNode) tooltip.classList.remove('visible'); }

function clearAll() {
  pinnedNode = null;
  document.querySelectorAll('.edge').forEach(el => el.classList.remove('hi','dim'));
  document.querySelectorAll('.edge-label').forEach(el => el.classList.remove('hi','dim'));
  document.querySelectorAll('.node-circle').forEach(el => el.classList.remove('dim','active'));
  document.querySelectorAll('.node-group').forEach(el => el.classList.remove('dim'));
  tooltip.classList.remove('visible');
}
document.addEventListener('click', () => { if (pinnedNode) clearAll(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && pinnedNode) clearAll(); });

render();
</script>
</body>
</html>
