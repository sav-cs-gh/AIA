  [61,16,'#00bcd4',''],[61,17,'#00bcd4',''],[61,72,'#00bcd4','пространств.'],
  // Аналитика
  [63,64,'#f5a623',''],[64,65,'#f5a623',''],[65,66,'#f5a623',''],
  [67,68,'#f5a623',''],[67,69,'#f5a623',''],
  [63,2,'#f5a623',''],[64,2,'#f5a623',''],[65,4,'#f5a623',''],[65,5,'#f5a623',''],[66,6,'#f5a623',''],
  [70,41,'#f5a623',''],[70,42,'#f5a623',''],
  [71,39,'#f5a623',''],[71,40,'#f5a623',''],[71,43,'#f5a623',''],
  // Вызовы
  [72,80,'#a855f7',''],[72,75,'#a855f7',''],[73,74,'#a855f7','взаим.'],
  [79,45,'#a855f7',''],[79,82,'#a855f7',''],[76,45,'#a855f7',''],
  [81,45,'#a855f7',''],[77,74,'#a855f7',''],[78,66,'#a855f7',''],
  [82,45,'#a855f7',''],[80,44,'#a855f7',''],
  // Основы DI
  [6,34,'#7ba7ff',''],[6,35,'#7ba7ff',''],
  [34,66,'#7ba7ff',''],[35,66,'#7ba7ff',''],
];

const ICONS = {
  flag:    [ ['path',{d:'M-1,-8 L-1,8 M-1,-8 L7,-5 L-1,-2'}] ],
  check:   [ ['path',{d:'M-8,0 L-3,5 L8,-6'}] ],
  wrench:  [ ['path',{d:'M-6,-6 L-2,-2 L-6,2 L-4,4 L0,0 L4,4 L8,0 L4,-4 L0,-8 L-4,-4 Z'}] ],
  gear:    [ ['circle',{cx:0,cy:0,r:4}],
             ['path',{d:'M0,-9 L0,-6 M0,6 L0,9 M-9,0 L-6,0 M6,0 L9,0 M-6,-6 L-4,-4 M4,4 L6,6 M-6,6 L-4,4 M4,-4 L6,-6'}] ],
  database:[ ['ellipse',{cx:0,cy:-5,rx:7,ry:2.5}],
             ['path',{d:'M-7,-5 L-7,5 Q-7,7.5 0,7.5 Q7,7.5 7,5 L7,-5'}],
             ['path',{d:'M-7,0 Q-7,2.5 0,2.5 Q7,2.5 7,0'}] ],
  shield:  [ ['path',{d:'M0,-8 L7,-5 L7,1 Q7,6 0,8 Q-7,6 -7,1 L-7,-5 Z'}] ]
};
const SUBCAT_ICON = {
  c1:'flag',
  t1:'check', t2:'wrench', t3:'wrench', t4:'gear', t5:'flag',
  i1:'flag', i2:'wrench', i3:'gear', i4:'database',
  d1:'database', d2:'database',
  a1:'check', a2:'gear',
  ch1:'shield', ch2:'shield', ch3:'shield'
};

const SUBCAT_TO_CAT = {};
SUBCATS.forEach(s => SUBCAT_TO_CAT[s.id] = s.cat);

const LAYOUT = (() => {
  const ROW_H = 60, SUB_HEADER = 32, BOTTOM_PAD = 24, CAT_HEADER = 48;
  const bySub = {};
  SUBCATS.forEach(s => bySub[s.id] = []);
  NODES_RAW.forEach(([num, name, sub]) => bySub[sub].push({ id:'n'+num, num, title:name, sub }));

  SUBCATS.forEach(sc => {
    const cat = CATS[sc.cat];
    sc.y = cat.y + CAT_HEADER;
    sc.count = bySub[sc.id].length;
    sc.h = SUB_HEADER + Math.max(1, sc.count) * ROW_H + BOTTOM_PAD;
  });

  Object.entries(CATS).forEach(([cid, cat]) => {
    const subs = SUBCATS.filter(s => s.cat === cid);
    cat.h = CAT_HEADER + Math.max(...subs.map(s => s.h)) + 14;
  });

  Object.values(bySub).forEach(arr => {
    if (!arr.length) return;
    const sc = SUBCATS.find(s => s.id === arr[0].sub);
    arr.forEach((n, i) => {
      n.x = sc.x + sc.w / 2;
      n.y = sc.y + SUB_HEADER + 20 + i * ROW_H;
      n.r = 13;
    });
  });

  const nodes = [];
  Object.values(bySub).forEach(arr => arr.forEach(n => nodes.push(n)));

  const totalW = 1600;
  const totalH = Math.max(...Object.values(CATS).map(c => c.y + c.h)) + 60;
  return { nodes, totalW, totalH };
})();

const NS = 'http://www.w3.org/2000/svg';
const tooltip = document.getElementById('tooltip');
let pinnedNode = null;

function createIcon(name) {
  const g = document.createElementNS(NS, 'g');
  (ICONS[name] || ICONS.check).forEach(([tag, attrs]) => {
    const el = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
    g.appendChild(el);
  });
  return g;
}
function wrapLabel(text, max) {
  if (text.length <= max) return [text];
  const words = text.split(' '); const lines = []; let cur = '';
  words.forEach(w => {
    if ((cur + ' ' + w).trim().length <= max) cur = (cur + ' ' + w).trim();
    else { if (cur) lines.push(cur); cur = w; }
  });
  if (cur) lines.push(cur);
  return lines.slice(0, 3);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const { nodes, totalW, totalH } = LAYOUT;
  const svg = document.getElementById('graph');
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);

  const defs = document.createElementNS(NS, 'defs');
  const grad = document.createElementNS(NS, 'linearGradient');
  grad.setAttribute('id', 'titleGradient');
  grad.setAttribute('x1', '0%'); grad.setAttribute('x2', '100%');
  [['0%','#5b8def','0'],['20%','#8ab4f8','1'],['50%','#ffffff','1'],
   ['80%','#8ab4f8','1'],['100%','#5b8def','0']].forEach(([off, col, op]) => {
    const s = document.createElementNS(NS, 'stop');
    s.setAttribute('offset', off); s.setAttribute('stop-color', col); s.setAttribute('stop-opacity', op);
    grad.appendChild(s);
  });
  defs.appendChild(grad); svg.appendChild(defs);

  const titleGroup = document.createElementNS(NS, 'g');
  const addText = (cls, y, text) => {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', cls); t.setAttribute('x', totalW / 2); t.setAttribute('y', y);
    t.textContent = text; return t;
  };
  titleGroup.appendChild(addText('main-subtitle', 32, 'ИНТЕРАКТИВНЫЙ ГРАФ СВЯЗЕЙ · ЛЕКЦИЯ 1'));
  titleGroup.appendChild(addText('main-title', 66, 'Основы интеллектуального анализа данных и ИИ'));
  const divider = document.createElementNS(NS, 'line');
  divider.setAttribute('class', 'title-line');
  divider.setAttribute('x1', totalW * 0.18); divider.setAttribute('x2', totalW * 0.82);
  divider.setAttribute('y1', 84); divider.setAttribute('y2', 84);
  titleGroup.appendChild(divider);
  titleGroup.appendChild(addText('main-legend', 104,
    `${NODES_RAW.length} понятий · ${SUBCATS.length} подкатегорий · ${Object.keys(CATS).length} категорий · ${EDGES_RAW.length} связей · 0 изолированных узлов`));
  svg.appendChild(titleGroup);

  Object.entries(CATS).forEach(([cid, cat]) => {
    const g = document.createElementNS(NS, 'g');
    const bg = document.createElementNS(NS, 'rect');
    bg.setAttribute('x', cat.x); bg.setAttribute('y', cat.y);
    bg.setAttribute('width', cat.w); bg.setAttribute('height', cat.h);
    bg.setAttribute('rx', 14); bg.setAttribute('fill', cat.color);
    bg.setAttribute('class', 'cluster-zone'); bg.setAttribute('stroke', cat.color);
    g.appendChild(bg);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', cat.x + 18); t.setAttribute('y', cat.y + 30);
    t.setAttribute('class', 'cluster-label'); t.setAttribute('fill', cat.color);
    t.textContent = cat.name; g.appendChild(t);
    const cnt = NODES_RAW.filter(n => SUBCAT_TO_CAT[n[2]] === cid).length;
    const ce = document.createElementNS(NS, 'text');
    ce.setAttribute('x', cat.x + cat.w - 18); ce.setAttribute('y', cat.y + 30);
    ce.setAttribute('class', 'cluster-count'); ce.setAttribute('fill', cat.color);
    ce.setAttribute('text-anchor', 'end');
    ce.textContent = cnt + ' узлов'; g.appendChild(ce);
    svg.appendChild(g);
  });

  SUBCATS.forEach(sc => {
    const g = document.createElementNS(NS, 'g');
    const bg = document.createElementNS(NS, 'rect');
    bg.setAttribute('x', sc.x); bg.setAttribute('y', sc.y);
    bg.setAttribute('width', sc.w); bg.setAttribute('height', sc.h);
    bg.setAttribute('rx', 8); bg.setAttribute('fill', sc.color);
    bg.setAttribute('class', 'subcluster-zone'); bg.setAttribute('stroke', sc.color);
    g.appendChild(bg);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', sc.x + sc.w / 2); t.setAttribute('y', sc.y + 20);
    t.setAttribute('class', 'subcluster-label'); t.setAttribute('fill', sc.color);
    t.setAttribute('text-anchor', 'middle'); t.textContent = sc.name;
    g.appendChild(t);
    const ce = document.createElementNS(NS, 'text');
    ce.setAttribute('x', sc.x + sc.w - 8); ce.setAttribute('y', sc.y + 20);
    ce.setAttribute('class', 'cluster-count'); ce.setAttribute('fill', sc.color);
    ce.setAttribute('text-anchor', 'end'); ce.textContent = sc.count;
    g.appendChild(ce);
    svg.appendChild(g);
  });

  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);

  const edgesG = document.createElementNS(NS, 'g');
  const edgeEls = [], edgeLabelEls = [];

  EDGES_RAW.forEach(([fromNum, toNum, color, label]) => {
    const a = nodeMap['n'+fromNum], b = nodeMap['n'+toNum];
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const ux = dx/dist, uy = dy/dist;
    const x1 = a.x + ux*a.r, y1 = a.y + uy*a.r;
    const x2 = b.x - ux*b.r, y2 = b.y - uy*b.r;
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    const off = 0.12 * dist;
    const cx = mx - uy*off, cy = my + ux*off;

    const path = document.createElementNS(NS, 'path');
    path.setAttribute('class', 'edge');
    path.setAttribute('d', `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);
    path.setAttribute('stroke', color);
    path.dataset.from = a.id; path.dataset.to = b.id;
    edgesG.appendChild(path); edgeEls.push(path);

    if (label) {
      const t = 0.5;
      const lx = (1-t)*(1-t)*x1 + 2*(1-t)*t*cx + t*t*x2;
      const ly = (1-t)*(1-t)*y1 + 2*(1-t)*t*cy + t*t*y2;
      const txt = document.createElementNS(NS, 'text');
      txt.setAttribute('class', 'edge-label');
      txt.setAttribute('x', lx); txt.setAttribute('y', ly - 2);
      txt.setAttribute('fill', color); txt.textContent = label;
      txt.dataset.from = a.id; txt.dataset.to = b.id;
      edgesG.appendChild(txt); edgeLabelEls.push(txt);
    }
  });
  svg.appendChild(edgesG);

  const nodesG = document.createElementNS(NS, 'g');
  const nodeEls = [];

  nodes.forEach(n => {
    const sc = SUBCATS.find(s => s.id === n.sub);
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'node-group'); g.dataset.id = n.id;

    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('class', 'node-circle');
    circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y);
    circle.setAttribute('r', n.r); circle.setAttribute('fill', sc.color);
    circle.style.color = sc.color;
    g.appendChild(circle);

    const iconWrap = document.createElementNS(NS, 'g');
    iconWrap.setAttribute('class', 'node-icon');
    iconWrap.setAttribute('transform', `translate(${n.x}, ${n.y}) scale(0.55)`);
    iconWrap.setAttribute('fill', 'none');
    iconWrap.setAttribute('stroke', '#ffffff');
    iconWrap.setAttribute('stroke-width', '2.4');
    iconWrap.setAttribute('stroke-linecap', 'round');
    iconWrap.setAttribute('stroke-linejoin', 'round');
    iconWrap.appendChild(createIcon(SUBCAT_ICON[n.sub]));
    g.appendChild(iconWrap);

    const label = document.createElementNS(NS, 'text');
    label.setAttribute('class', 'node-label');
    label.setAttribute('x', n.x); label.setAttribute('y', n.y + n.r + 11);
    wrapLabel(n.title, 24).forEach((ln, i) => {
      const tspan = document.createElementNS(NS, 'tspan');
      tspan.setAttribute('x', n.x); tspan.setAttribute('dy', i === 0 ? 0 : 9);
      tspan.textContent = ln; label.appendChild(tspan);
    });
    g.appendChild(label);

    g.addEventListener('mouseenter', evt => {
      if (!pinnedNode) highlightNode(n.id, edgeEls, edgeLabelEls, nodeEls);
      showTooltip(n, sc, evt);
    });
    g.addEventListener('mousemove', moveTooltip);
    g.addEventListener('mouseleave', () => {
      if (!pinnedNode) { clearHighlight(edgeEls, edgeLabelEls, nodeEls); hideTooltip(); }
    });
    g.addEventListener('click', evt => {
      evt.stopPropagation();
      if (pinnedNode && pinnedNode.id === n.id) {
        pinnedNode = null;
        clearHighlight(edgeEls, edgeLabelEls, nodeEls);
        tooltip.classList.remove('visible');
      } else {
        pinnedNode = n;
        highlightNode(n.id, edgeEls, edgeLabelEls, nodeEls);
        showTooltip(n, sc, { clientX: evt.clientX, clientY: evt.clientY }, true);
      }
    });

    nodesG.appendChild(g);
    nodeEls.push({ id: n.id, g, circle });
  });
  svg.appendChild(nodesG);
}

function highlightNode(id, edgeEls, edgeLabelEls, nodeEls) {
  const conn = new Set([id]);
  edgeEls.forEach(el => {
    if (el.dataset.from === id || el.dataset.to === id) {
      el.classList.add('hi'); el.classList.remove('dim');
      conn.add(el.dataset.from); conn.add(el.dataset.to);
    } else { el.classList.add('dim'); el.classList.remove('hi'); }
  });
  edgeLabelEls.forEach(el => {
    if (el.dataset.from === id || el.dataset.to === id) {
      el.classList.add('hi'); el.classList.remove('dim');
    } else { el.classList.add('dim'); el.classList.remove('hi'); }
  });
  nodeEls.forEach(ne => {
    if (conn.has(ne.id)) { ne.circle.classList.remove('dim'); ne.g.classList.remove('dim'); }
    else { ne.circle.classList.add('dim'); ne.g.classList.add('dim'); }
  });
}
function clearHighlight(edgeEls, edgeLabelEls, nodeEls) {
  edgeEls.forEach(el => el.classList.remove('hi','dim'));
  edgeLabelEls.forEach(el => el.classList.remove('hi','dim'));
  nodeEls.forEach(ne => {
    ne.circle.classList.remove('dim','active');
    ne.g.classList.remove('dim');
  });
}
function showTooltip(n, sc, evt, isPinned) {
  const cat = CATS[sc.cat];
  const desc = DESCRIPTIONS[n.num] || '';
  tooltip.innerHTML = `
    <h4>${escapeHtml(n.title)}</h4>
    <div class="tt-sub" style="color:${sc.color}">${escapeHtml(cat.name.replace(/^[^\s]+\s/, ''))} · ${escapeHtml(sc.name)}</div>
    <div class="tt-desc">${escapeHtml(desc)}</div>
    <div class="tt-hint">${isPinned ? 'Кликните ещё раз, чтобы открепить' : 'Кликните, чтобы закрепить →'}</div>
  `;
  tooltip.classList.add('visible');
  moveTooltip(evt);
}
function moveTooltip(evt) {
  const pad = 16;
  const w = tooltip.offsetWidth, h = tooltip.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > window.innerWidth - 8)  x = evt.clientX - w - pad;
  if (y + h > window.innerHeight - 8) y = evt.clientY - h - pad;
  tooltip.style.left = Math.max(8, x) + 'px';
  tooltip.style.top  = Math.max(8, y) + 'px';
}
function hideTooltip() { if (!pinnedNode) tooltip.classList.remove('visible'); }

function clearAll() {
  pinnedNode = null;
  document.querySelectorAll('.edge').forEach(el => el.classList.remove('hi','dim'));
  document.querySelectorAll('.edge-label').forEach(el => el.classList.remove('hi','dim'));
  document.querySelectorAll('.node-circle').forEach(el => el.classList.remove('dim','active'));
  document.querySelectorAll('.node-group').forEach(el => el.classList.remove('dim'));
  tooltip.classList.remove('visible');
}
document.addEventListener('click', () => { if (pinnedNode) clearAll(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && pinnedNode) clearAll(); });

render();
</script>
