  <!-- БЛОК 2: DASHBOARD THINKING -->
  <!-- ============================================================ -->
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter9.md#sect2">
  <rect x="620" y="110" width="500" height="295" fill="#e6e6e6" rx="10" stroke="#999" stroke-width="2"/>

  <rect x="645" y="125" width="450" height="40" fill="#666" rx="6"/>
  <text x="870" y="153" font-size="24" fill="#fff" font-weight="bold" text-anchor="middle">Аналитические панели (Dashboard)</text>
  </a>
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter9.md#sect2.1">
  <text x="655" y="195" font-size="20" fill="#000" font-weight="bold">Принципы проектирования</text>
 </a>
  <text x="665" y="220" font-size="18" fill="#333" text-anchor="start">1. Целевая ориентация (под задачу)</text>
  <text x="665" y="245" font-size="18" fill="#333" text-anchor="start">2. Иерархия информации</text>
  <text x="665" y="270" font-size="18" fill="#333" text-anchor="start">3. Контекстуализация метрик</text>
  <text x="665" y="295" font-size="18" fill="#333" text-anchor="start">4. Согласованность визуального языка</text>
  <text x="665" y="320" font-size="18" fill="#333" text-anchor="start">5. Минимизация визуального шума</text>
  <text x="665" y="345" font-size="18" fill="#333" text-anchor="start">6. Интерактивность</text>
  <text x="665" y="370" font-size="18" fill="#333" text-anchor="start">7. Объяснимость результатов модели</text>
