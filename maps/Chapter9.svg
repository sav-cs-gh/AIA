  <!-- ============================================================ -->
  <!-- БЛОК 1: ВИЗУАЛЬНАЯ АНАЛИТИКА -->
  <!-- ============================================================ -->
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter9.md#sect1">
