</a>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter9.md#sect3.1">
  <text x="80" y="515" font-size="20" fill="#000" font-weight="bold">Уровни интерпретации</text>
  <rect x="80" y="535" width="190" height="80" fill="#ccc" rx="5"/>
  <text x="175" y="562" font-size="20" fill="#000" font-weight="bold" text-anchor="middle">Глобальная</text>
  </a>
  <text x="175" y="590" font-size="16" fill="#333" text-anchor="middle">Как модель работает</text>
  <text x="175" y="610" font-size="16" fill="#333" text-anchor="middle">в целом?</text>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter9.md#sect3.2">
  <rect x="280" y="535" width="190" height="80" fill="#ccc" rx="5"/>
  <text x="375" y="562" font-size="20" fill="#000" font-weight="bold" text-anchor="middle">Локальная</text>
  </a>
  <text x="375" y="590" font-size="16" fill="#333" text-anchor="middle">Почему для конкретного</text>
  <text x="375" y="610" font-size="16" fill="#333" text-anchor="middle">объекта такой прогноз?</text>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter9.md#sect3.3">
  <text x="80" y="650" font-size="20" fill="#000" font-weight="bold">Зачем нужна интерпретируемость?</text>
  </a>
  <text x="90" y="675" font-size="18" fill="#333" text-anchor="start">• Доверие пользователей</text>
  <text x="90" y="700" font-size="18" fill="#333" text-anchor="start">• Регуляторные требования (аудит)</text>
  <text x="90" y="725" font-size="18" fill="#333" text-anchor="start">• Выявление смещений и дискриминации</text>
  <text x="90" y="750" font-size="18" fill="#333" text-anchor="start">• Контроль корректности модели</text>

  <!-- ============================================================ -->
  <!-- БЛОК 4: FEATURE IMPORTANCE и SHAP -->
  <!-- ============================================================ -->
     <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter9.md#sect4">
  <rect x="620" y="430" width="500" height="340" fill="#e6e6e6" rx="10" stroke="#999" stroke-width="2"/>
  <rect x="645" y="445" width="450" height="40" fill="#666" rx="6"/>
  <text x="870" y="473" font-size="24" fill="#fff" font-weight="bold" text-anchor="middle">Важность признаков и SHAP</text>
</a>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter9.md#sect4.1">
  <text x="655" y="515" font-size="20" fill="#000" font-weight="bold">Методы оценки важности</text>
  <text x="665" y="540" font-size="18" fill="#333" text-anchor="start">• Встроенные (коэффициенты, gini importance)</text>
  <text x="665" y="565" font-size="18" fill="#333" text-anchor="start">• Permutation importance (модельно-агностичный)</text>
</a>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter9.md#sect5">
  <rect x="640" y="585" width="455" height="90" fill="#ccc" rx="5"/>
  <text x="855" y="612" font-size="22" fill="#000" font-weight="bold" text-anchor="middle">SHAP (SHapley Additive exPlanations)</text>
  </a>
  <text x="665" y="640" font-size="18" fill="#333" text-anchor="start">• Основан на значениях Шепли (теория игр)</text>
  <text x="665" y="665" font-size="18" fill="#333" text-anchor="start">• Свойства: локальная точность, согласованность</text>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter9.md#sect5.1">
  <text x="645" y="700" font-size="20" fill="#000" font-weight="bold">Типы SHAP-визуализаций</text>
  </a>
  <text x="665" y="725" font-size="18" fill="#333" text-anchor="start">• Summary plot (глобальный рейтинг + направление)</text>
  <text x="665" y="750" font-size="18" fill="#333" text-anchor="start">• Force plot / Waterfall plot (локальное объяснение)</text>

