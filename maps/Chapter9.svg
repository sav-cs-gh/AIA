  <rect x="70" y="125" width="505" height="40" fill="#666" rx="6"/>
  <text x="340" y="153" font-size="24" fill="#fff" font-weight="bold" text-anchor="middle">Визуальная аналитика</text>
</a>
  <text x="80" y="195" font-size="20" fill="#000" font-weight="bold">Сущность</text>
  <text x="90" y="220" font-size="18" fill="#333" text-anchor="start">• Интерактивные визуальные интерфейсы</text>
  <text x="90" y="245" font-size="18" fill="#333" text-anchor="start">• Поддержка аналитического мышления</text>
  <text x="90" y="270" font-size="18" fill="#333" text-anchor="start">• Выявление трендов, аномалий, кластеров</text>
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter9.md#sect1.2">
  <rect x="60" y="295" width="530" height="40" fill="#ccc" rx="5"/>
  <text x="320" y="322" font-size="20" fill="#000" font-weight="bold" text-anchor="middle">Цикл: данные → визуализация → интерпретация</text>
</a>
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter9.md#sect1.1">
  <text x="80" y="370" font-size="20" fill="#000" font-weight="bold">Visual mining</text>
  </a>
  <text x="90" y="395" font-size="18" fill="#333" text-anchor="start">Сочетание data mining + интерактивной визуализации</text>

