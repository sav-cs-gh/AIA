  <rect x="615" y="762" width="555" height="18" fill="#4a4a4a"/>
  <text x="892" y="763" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">6. Управление промптами</text>
</a>
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect6.1"> 
  <text x="635" y="805" font-size="20" font-weight="bold" fill="#1a1a1a">Версионировать:</text>
</a>  
  <text x="650" y="835" font-size="17" fill="#2a2a2a">• Системные промпты</text>
  <text x="650" y="863" font-size="17" fill="#2a2a2a">• Пользовательские шаблоны</text>
  <text x="650" y="891" font-size="17" fill="#2a2a2a">• Few-shot примеры</text>
  <text x="650" y="919" font-size="17" fill="#2a2a2a">• Параметры генерации</text>
  <text x="650" y="947" font-size="17" fill="#2a2a2a">• Версии retrieval-источников</text>
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect6.2">  
  <text x="635" y="985" font-size="20" font-weight="bold" fill="#1a1a1a">Практики:</text>
</a>  
  <text x="650" y="1015" font-size="17" fill="#2a2a2a">Хранение в репозитории, A/B-тесты, журналирование</text>
  
