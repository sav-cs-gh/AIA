  <text x="600" y="55" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff">Глава 15. MLOps, LLMOps, этика и безопасность ИИ</text>
  <text x="600" y="92" text-anchor="middle" font-size="26" fill="#cccccc">в аналитике</text>
 </a> 
  <!-- ==================== БЛОК 1: MLOps ==================== -->
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect1">   
  <rect x="30" y="125" width="555" height="315" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="30" y="125" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="30" y="157" width="555" height="18" fill="#4a4a4a"/>
  <text x="307" y="158" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">1. MLOps</text>
</a>  
  <text x="50" y="205" font-size="20" font-weight="bold" fill="#1a1a1a">Определение:</text>
  <text x="50" y="235" font-size="18" fill="#2a2a2a">Machine Learning Operations —</text>
  <text x="50" y="263" font-size="18" fill="#2a2a2a">практики управления жизненным циклом</text>
  <text x="50" y="291" font-size="18" fill="#2a2a2a">моделей ML в промышленной среде</text>
  
  <text x="50" y="330" font-size="20" font-weight="bold" fill="#1a1a1a">Ключевые задачи:</text>
  <text x="65" y="358" font-size="17" fill="#2a2a2a">• Воспроизводимость экспериментов</text>
  <text x="65" y="382" font-size="17" fill="#2a2a2a">• Управление версиями данных и кода</text>
  <text x="65" y="406" font-size="17" fill="#2a2a2a">• Автоматизация деплоя и мониторинг</text>
  <text x="65" y="430" font-size="17" fill="#2a2a2a">• Обнаружение дрейфа данных</text>
  
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect2">   
  <!-- ==================== БЛОК 2: Воспроизводимость ==================== -->
  <rect x="615" y="125" width="555" height="315" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="615" y="125" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="615" y="157" width="555" height="18" fill="#4a4a4a"/>
  <text x="892" y="158" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">2. Воспроизводимость</text>
</a>  
  <text x="635" y="205" font-size="20" font-weight="bold" fill="#1a1a1a">Необходимо фиксировать:</text>
  <text x="650" y="235" font-size="17" fill="#2a2a2a">• Версии данных</text>
  <text x="650" y="263" font-size="17" fill="#2a2a2a">• Код и конфигурации</text>
  <text x="650" y="291" font-size="17" fill="#2a2a2a">• Параметры модели</text>
  <text x="650" y="319" font-size="17" fill="#2a2a2a">• Библиотеки и зависимости</text>
  <text x="650" y="347" font-size="17" fill="#2a2a2a">• Вычислительную среду</text>
  
  <text x="635" y="385" font-size="20" font-weight="bold" fill="#1a1a1a">Инструменты:</text>
  <text x="650" y="415" font-size="17" fill="#2a2a2a">Git, Docker, MLflow, DVC, WandB</text>
  
  <!-- ==================== БЛОК 3: Деплой ==================== -->
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect3">   
  <rect x="30" y="460" width="555" height="255" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="30" y="460" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="30" y="492" width="555" height="18" fill="#4a4a4a"/>
  <text x="307" y="493" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">3. Развертывание (деплой) моделей</text>
</a>
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect3.1">  
  <text x="50" y="535" font-size="20" font-weight="bold" fill="#1a1a1a">Сценарии развертывания:</text>
</a>  
  <text x="65" y="565" font-size="17" fill="#2a2a2a">• Пакетная обработка (batch)</text>
  <text x="65" y="593" font-size="17" fill="#2a2a2a">• Онлайн-инференс (REST API)</text>
  <text x="65" y="621" font-size="17" fill="#2a2a2a">• Потоковая обработка (streaming)</text>
  <text x="65" y="648" font-size="17" fill="#2a2a2a">• Edge / встраиваемые системы</text>
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect3.2"> 
  <text x="50" y="677" font-size="20" font-weight="bold" fill="#1a1a1a">Требования:</text>
</a>  
  <text x="65" y="704" font-size="17" fill="#2a2a2a">Стабильность, масштабируемость, безопасность</text>
  
  <!-- ==================== БЛОК 4: Мониторинг ==================== -->
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect4">   
  <rect x="615" y="460" width="555" height="255" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="615" y="460" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="615" y="492" width="555" height="18" fill="#4a4a4a"/>
  <text x="892" y="493" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">4. Мониторинг качества</text>
</a> 
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect4.1"> 
  <text x="635" y="535" font-size="20" font-weight="bold" fill="#1a1a1a">Типы дрейфа:</text>
</a>
  <text x="650" y="565" font-size="17" fill="#2a2a2a">• Data drift — изменение данных</text>
  <text x="650" y="593" font-size="17" fill="#2a2a2a">• Concept drift — изменение связи</text>
  <text x="650" y="621" font-size="17" fill="#2a2a2a">• Label drift — изменение меток</text>
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect4.2"> 
  <text x="635" y="660" font-size="20" font-weight="bold" fill="#1a1a1a">Методы обнаружения:</text>
</a>  
  <text x="650" y="687" font-size="17" fill="#2a2a2a">PSI, KL-дивергенция, стат. тесты</text>
  
  <!-- ==================== БЛОК 5: LLMOps ==================== -->
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect5">   
  <rect x="30" y="730" width="555" height="295" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="30" y="730" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="30" y="762" width="555" height="18" fill="#4a4a4a"/>
  <text x="307" y="763" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">5. LLMOps</text>
</a>
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect5.1">
  <text x="50" y="805" font-size="20" font-weight="bold" fill="#1a1a1a">Особенности vs MLOps:</text>
</a>  
  <text x="65" y="835" font-size="17" fill="#2a2a2a">• Зависимость от промптов</text>
  <text x="65" y="863" font-size="17" fill="#2a2a2a">• Версионирование промптов</text>
  <text x="65" y="891" font-size="17" fill="#2a2a2a">• Retrieval-компоненты</text>
  <text x="65" y="919" font-size="17" fill="#2a2a2a">• Недетерминированные ответы</text>
  <text x="65" y="947" font-size="17" fill="#2a2a2a">• Галлюцинации</text>
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect5.2"> 
  <text x="50" y="985" font-size="20" font-weight="bold" fill="#1a1a1a">Компоненты LLM-системы:</text>
</a>  
  <text x="65" y="1015" font-size="17" fill="#2a2a2a">LLM + Промпты + Retrieval + Инструменты + Память + Фильтры</text>
  
  <!-- ==================== БЛОК 6: Управление промптами ==================== -->
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect6">   
  <rect x="615" y="730" width="555" height="295" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
