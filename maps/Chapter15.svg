  <rect x="615" y="1087" width="555" height="18" fill="#3a3a3a"/>
  <text x="892" y="1088" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">8. Риски генеративного ИИ</text>
</a>  
  <text x="635" y="1130" font-size="19" font-weight="bold" fill="#1a1a1a">Галлюцинации</text>
  <text x="650" y="1157" font-size="17" fill="#333">Правдоподобные, но неверные выводы</text>
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect8.1"> 
  <text x="635" y="1194" font-size="19" font-weight="bold" fill="#1a1a1a">Prompt injection</text>
</a>  
  <text x="650" y="1221" font-size="17" fill="#333">Атаки через вредоносные инструкции</text>
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect8.2">
  <text x="635" y="1258" font-size="19" font-weight="bold" fill="#1a1a1a">Утечка информации</text>
</a>  
  <text x="650" y="1285" font-size="17" fill="#333">Раскрытие конфиденциальных данных</text>
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect8.3"> 
  <text x="635" y="1312" font-size="19" font-weight="bold" fill="#1a1a1a">Смещение автоматизации (Automation bias)</text>
</a>  
  <text x="650" y="1339" font-size="17" fill="#333">Чрезмерное доверие к автоматическим выводам</text>
  
