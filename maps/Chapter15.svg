 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect7.1"> 
  <text x="50" y="1130" font-size="20" font-weight="bold" fill="#1a1a1a">Принципы:</text>
</a>  
  <text x="65" y="1157" font-size="17" fill="#2a2a2a">• Справедливость (Fairness)</text>
  <text x="65" y="1188" font-size="17" fill="#2a2a2a">• Прозрачность</text>
  <text x="65" y="1216" font-size="17" fill="#2a2a2a">• Подотчетность</text>
  <text x="65" y="1244" font-size="17" fill="#2a2a2a">• Безопасность и надежность</text>
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect7.2"> 
  <text x="50" y="1285" font-size="20" font-weight="bold" fill="#1a1a1a">Приватность данных:</text>
</a>  
  <text x="65" y="1315" font-size="17" fill="#2a2a2a">Минимизация, анонимизация, разграничение доступа</text>
  
  <!-- ==================== БЛОК 8: Риски ==================== -->
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter15.md#sect8">   
