  <text x="600" y="1273" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">8. Принципы эффективного применения</text>
</a>  
  <text x="60" y="1325" font-size="20" fill="#1a1a1a">• Использовать в режиме поддержки эксперта, а не полной замены</text>
  <text x="60" y="1360" font-size="20" fill="#1a1a1a">• Обеспечивать контроль доступа и безопасную передачу данных</text>
  <text x="60" y="1395" font-size="20" fill="#1a1a1a">• Сочетать с доменной валидацией и проверкой результатов</text>
  
