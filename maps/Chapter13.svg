  <text x="270" y="925" font-size="18" fill="#2a2a2a">• Visual QA</text>
  <text x="65" y="955" font-size="18" fill="#2a2a2a">• Document QA</text>
  <text x="270" y="955" font-size="18" fill="#2a2a2a">• Multimodal reasoning</text>
  <text x="65" y="985" font-size="18" fill="#2a2a2a">• Image-text retrieval</text>
  
