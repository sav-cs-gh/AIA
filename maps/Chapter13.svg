  <text x="320" y="540" font-size="18" fill="#2a2a2a">• Спутниковые снимки</text>
  <text x="65" y="570" font-size="18" fill="#2a2a2a">• Медицинские изображения</text>
  <text x="320" y="570" font-size="18" fill="#2a2a2a">• Скриншоты интерфейсов</text>
