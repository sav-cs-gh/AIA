</a>
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter13.md#sect7.3"> 
  <rect x="800" y="1085" width="340" height="110" rx="8" fill="#c0c0c0" stroke="#666" stroke-width="2"/>
  <text x="970" y="1118" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Неинтерпретируемость</text>
  <text x="820" y="1150" font-size="18" fill="#2a2a2a">Сложность аудита и</text>
  <text x="820" y="1178" font-size="18" fill="#2a2a2a">объяснения выводов модели</text>
</a>  
