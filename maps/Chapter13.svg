  <text x="50" y="240" font-size="18" fill="#2a2a2a">Данные в нескольких формах,</text>
  <text x="50" y="268" font-size="18" fill="#2a2a2a">каждая из которых несёт часть</text>
  <text x="50" y="296" font-size="18" fill="#2a2a2a">информации об объекте/процессе</text>
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter13.md#sect1.1">   
