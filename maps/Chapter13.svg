  <rect x="60" y="1085" width="340" height="110" rx="8" fill="#c0c0c0" stroke="#666" stroke-width="2"/>
  <text x="230" y="1118" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Ошибки выравнивания</text>
  <text x="80" y="1150" font-size="18" fill="#2a2a2a">Неверное сопоставление</text>
