  <text x="200" y="363" font-size="18" fill="#2a2a2a">• Изображения</text>
  <text x="380" y="363" font-size="18" fill="#2a2a2a">• Таблицы</text>
  <text x="65" y="393" font-size="18" fill="#2a2a2a">• Диаграммы</text>
  <text x="200" y="393" font-size="18" fill="#2a2a2a">• Сканы документов</text>
  
