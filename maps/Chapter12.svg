  <rect x="615" y="677" width="555" height="18" fill="#4a4a4a"/>
  <text x="892" y="678" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">5. Векторный поиск и эмбеддинги</text>
</a>  
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect6.1">
  <text x="635" y="725" font-size="19" font-weight="bold" fill="#1a1a1a">Как работает:</text>
</a>  
  <text x="650" y="755" font-size="17" fill="#2a2a2a">Текст → Модель эмбеддингов →</text>
  <text x="650" y="782" font-size="17" fill="#2a2a2a">→ Числовой вектор (эмбеддинг)</text>
  <text x="650" y="815" font-size="17" fill="#2a2a2a">Поиск = ближайшие соседи</text>
  <text x="650" y="842" font-size="17" fill="#2a2a2a">в многомерном пространстве</text>
  
  <text x="635" y="885" font-size="19" font-weight="bold" fill="#1a1a1a">Инструменты:</text>
  <text x="650" y="915" font-size="17" fill="#2a2a2a">FAISS, Milvus, Qdrant, Weaviate</text>
  
