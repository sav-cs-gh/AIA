<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect5.1">  
  <text x="50" y="725" font-size="19" font-weight="bold" fill="#1a1a1a">1. Подготовка документов:</text>
</a>  
  <text x="65" y="752" font-size="17" fill="#2a2a2a">• Извлечение текста из файлов</text>
  <text x="65" y="776" font-size="17" fill="#2a2a2a">• Нормализация и очистка</text>
  <text x="65" y="800" font-size="17" fill="#2a2a2a">• Разметка метаданных</text>
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect5.2">  
  <text x="50" y="838" font-size="19" font-weight="bold" fill="#1a1a1a">2. Чанкирование:</text>
</a>  
  <text x="65" y="865" font-size="17" fill="#2a2a2a">• Размер 300–1000 слов</text>
  <text x="65" y="889" font-size="17" fill="#2a2a2a">• Перекрытие 10–20%</text>
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect5.3">  
  <text x="50" y="927" font-size="19" font-weight="bold" fill="#1a1a1a">3. Индексирование:</text>
  <text x="65" y="954" font-size="17" fill="#2a2a2a">• Вычисление эмбеддингов</text>
  <text x="65" y="978" font-size="17" fill="#2a2a2a">• Загрузка в векторную БД</text>
</a>  
  <!-- ==================== БЛОК 5: Векторный поиск ==================== -->
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect6">  
  <rect x="615" y="645" width="555" height="345" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
