<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect7.1">  
  <rect x="80" y="1085" width="320" height="130" rx="8" fill="#ccc" stroke="#666" stroke-width="1.5"/>
  <text x="240" y="1115" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Искажение реальности</text>
  <text x="100" y="1145" font-size="16" fill="#333">Искусственный материал</text>
  <text x="100" y="1170" font-size="16" fill="#333">кажется реалистичным, но</text>
  <text x="100" y="1195" font-size="16" fill="#333">искажает предметную область</text>
</a>  
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect7.2">  
  <rect x="440" y="1085" width="320" height="130" rx="8" fill="#ccc" stroke="#666" stroke-width="1.5"/>
  <text x="600" y="1115" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Ложное доверие</text>
  <text x="460" y="1145" font-size="16" fill="#333">Профессиональный вид</text>
  <text x="460" y="1170" font-size="16" fill="#333">порождает иллюзию</text>
  <text x="460" y="1195" font-size="16" fill="#333">корректности результатов</text>
</a>  
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect0">  
  <rect x="800" y="1085" width="320" height="130" rx="8" fill="#ccc" stroke="#666" stroke-width="1.5"/>
  <text x="960" y="1115" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Утечка данных</text>
  <text x="820" y="1145" font-size="16" fill="#333">Некачественная генерация</text>
  <text x="820" y="1170" font-size="16" fill="#333">сохраняет близость к</text>
  <text x="820" y="1195" font-size="16" fill="#333">реальным записям</text>
</a>  
