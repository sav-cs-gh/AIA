  <text x="600" y="92" text-anchor="middle" font-size="26" fill="#cccccc">по корпоративным документам и базам знаний</text>
</a>  
  <!-- ==================== БЛОК 1: Что такое RAG ==================== -->
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect1">  
  <rect x="30" y="125" width="555" height="320" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="30" y="125" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="30" y="157" width="555" height="18" fill="#4a4a4a"/>
  <text x="307" y="158" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">1. Что такое RAG?</text>
</a>  
  <text x="50" y="205" font-size="20" font-weight="bold" fill="#1a1a1a">Определение:</text>
  <text x="50" y="235" font-size="18" fill="#2a2a2a">Retrieval-Augmented Generation —</text>
  <text x="50" y="263" font-size="18" fill="#2a2a2a">генерация с извлечением из внешних</text>
  <text x="50" y="291" font-size="18" fill="#2a2a2a">источников знаний</text>
  
  <text x="50" y="330" font-size="20" font-weight="bold" fill="#1a1a1a">Решаемые проблемы LLM:</text>
  <text x="65" y="358" font-size="17" fill="#2a2a2a">• Ограниченность параметрической памяти</text>
  <text x="65" y="382" font-size="17" fill="#2a2a2a">• Устаревание знаний</text>
  <text x="65" y="406" font-size="17" fill="#2a2a2a">• Галлюцинации (неверные утверждения)</text>
  <text x="65" y="430" font-size="17" fill="#2a2a2a">• Отсутствие привязки к источникам</text>
  
  <!-- ==================== БЛОК 2: Компоненты RAG ==================== -->
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect2"> 
  <rect x="615" y="125" width="555" height="320" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="615" y="125" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="615" y="157" width="555" height="18" fill="#4a4a4a"/>
  <text x="892" y="158" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">2. Компоненты RAG-архитектуры</text>
</a>
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect2.1">
  <text x="635" y="205" font-size="19" font-weight="bold" fill="#1a1a1a">Источники данных:</text>
</a>  
  <text x="650" y="232" font-size="17" fill="#2a2a2a">• PDF, DOCX, XLSX, PPTX</text>
  <text x="650" y="256" font-size="17" fill="#2a2a2a">• Базы знаний, wiki-системы</text>
  <text x="650" y="280" font-size="17" fill="#2a2a2a">• CRM, ERP, Service Desk</text>
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect2.2">  
  <text x="635" y="320" font-size="19" font-weight="bold" fill="#1a1a1a">Механизмы поиска:</text>
  <text x="650" y="347" font-size="17" fill="#2a2a2a">• Векторный поиск (эмбеддинги)</text>
  <text x="650" y="371" font-size="17" fill="#2a2a2a">• Лексический поиск (BM25)</text>
  <text x="650" y="395" font-size="17" fill="#2a2a2a">• Гибридный поиск</text>
</a>  
