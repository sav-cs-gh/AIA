  <rect x="620" y="180" width="530" height="20" fill="#555"/>
  <text x="885" y="182" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">2. Методы генерации</text>
</a> 
  <text x="640" y="225" font-size="19" font-weight="bold" fill="#222">Правило-ориентированная:</text>
  <text x="650" y="252" font-size="17" fill="#333">• Прозрачность</text>
  <text x="650" y="276" font-size="17" fill="#333">• Ограниченная реалистичность</text>
  
  <text x="640" y="312" font-size="19" font-weight="bold" fill="#222">Статистическое моделирование:</text>
  <text x="650" y="339" font-size="17" fill="#333">• Сохранение закономерностей</text>
  <text x="650" y="363" font-size="17" fill="#333">• Трудности с нелинейностями</text>
  
  <text x="640" y="399" font-size="19" font-weight="bold" fill="#222">Генеративные модели (GAN, VAE, CTGAN):</text>
  <text x="650" y="426" font-size="17" fill="#333">• Сложные многомерные зависимости</text>
  
