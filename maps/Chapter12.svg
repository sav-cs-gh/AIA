  <text x="660" y="950" font-size="17" fill="#333">• Адаптация к аудитории</text>
  <text x="660" y="975" font-size="17" fill="#333">• Риск недостоверных утверждений</text>
  
  <!-- Блок 7: Риски -->
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect7">  
