  <text x="70" y="225" font-size="20" font-weight="bold" fill="#222">Определение:</text>
  <text x="70" y="255" font-size="18" fill="#333">Искусственно созданные данные,</text>
  <text x="70" y="280" font-size="18" fill="#333">имитирующие свойства реальных</text>
  
  <text x="70" y="320" font-size="18" font-weight="bold" fill="#222">Применение:</text>
  <text x="80" y="348" font-size="17" fill="#333">• Тестирование систем</text>
  <text x="80" y="372" font-size="17" fill="#333">• Обучение моделей</text>
  <text x="80" y="396" font-size="17" fill="#333">• Балансировка классов</text>
  <text x="80" y="420" font-size="17" fill="#333">• Защита конфиденциальности</text>
  
  <!-- Блок 2: Методы генерации -->
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter12.md#sect0">  
  <rect x="620" y="150" width="530" height="285" rx="10" fill="#e0e0e0" stroke="#555" stroke-width="2"/>
