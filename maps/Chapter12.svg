  <rect x="50" y="1300" width="1100" height="20" fill="#555"/>
  <text x="600" y="1302" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">8. Практические рекомендации</text>
</a>  
  <text x="80" y="1345" font-size="18" fill="#222">1. Чётко определять цель генерации</text>
  <text x="80" y="1375" font-size="18" fill="#222">2. Проверять статистическое и прикладное качество</text>
  <text x="80" y="1405" font-size="18" fill="#222">3. Не заменять полностью реальные данные</text>
  <text x="80" y="1435" font-size="18" fill="#222">4. Использовать auto-EDA как стартовый этап</text>
  <text x="550" y="1345" font-size="18" fill="#222">5. Редактировать автоматически созданные отчёты</text>
  <text x="550" y="1375" font-size="18" fill="#222">6. Оценивать риски конфиденциальности</text>
  <text x="550" y="1405" font-size="18" fill="#222">7. Фиксировать ограничения и допущения</text>
  
