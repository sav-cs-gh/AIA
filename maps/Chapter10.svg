<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" font-family="Arial, Helvetica, sans-serif">
  
  <!-- Фон -->
  <rect width="1200" height="1600" fill="#f8f8f8"/>
  
  <!-- Заголовок -->
  <rect x="50" y="30" width="1100" height="80" rx="10" fill="#333"/>
  <text x="600" y="78" text-anchor="middle" fill="#fff" font-size="32" font-weight="bold">Глава 10. Анализ текстовых данных и основы NLP для аналитики</text>
  
  <!-- Блок 1: Текстовые данные -->
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect1">
  <rect x="50" y="130" width="1100" height="200" rx="8" fill="#e0e0e0" stroke="#666" stroke-width="2"/>
  <text x="70" y="165" fill="#000" font-size="24" font-weight="bold">1. Текстовые данные как объект аналитики</text>
  </a>
  <text x="70" y="200" fill="#111" font-size="18">• Неструктурированные, высокая размерность словаря</text>
  <text x="70" y="230" fill="#111" font-size="18">• Синонимия, полисемия, морфологическое разнообразие</text>
  <text x="70" y="260" fill="#111" font-size="18">• Шумы, опечатки, сокращения, неформальная лексика</text>
  <text x="70" y="290" fill="#111" font-size="18">• Неоднородность длины текстов</text>
  
  <!-- Блок 2: Аналитический конвейер -->
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect1.2">
  <rect x="50" y="350" width="1100" height="160" rx="8" fill="#ccc" stroke="#666" stroke-width="2"/>
  <text x="70" y="385" fill="#000" font-size="24" font-weight="bold">Типичный аналитический конвейер</text>
</a>  
  <text x="70" y="420" fill="#111" font-size="18">1. Сбор и загрузка текстовых данных</text>
  <text x="70" y="448" fill="#111" font-size="18">2. Очистка и предобработка</text>
  <text x="70" y="476" fill="#111" font-size="18">3. Токенизация и нормализация</text>
  <text x="70" y="504" fill="#111" font-size="18">4. Преобразование в числовое представление → 5. Моделирование → 6. Оценка → 7. Интерпретация</text>
  
  <!-- Блок 3: Предобработка -->
<a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect2">
  <rect x="50" y="530" width="1100" height="210" rx="8" fill="#d0d0d0" stroke="#666" stroke-width="2"/>
  <text x="70" y="565" fill="#000" font-size="24" font-weight="bold">2. Предобработка текстов</text>
</a>
  <text x="70" y="600" fill="#111" font-size="18">• Очистка: удаление HTML-тегов, спецсимволов, лишних пробелов</text>
  <text x="70" y="630" fill="#111" font-size="18">• Приведение к нижнему регистру (кроме NER)</text>
  <text x="70" y="660" fill="#111" font-size="18">• Токенизация: разбиение на слова, подслова, предложения</text>
  <text x="70" y="690" fill="#111" font-size="18">• Стоп-слова: удаление высокочастотных служебных слов</text>
  <text x="70" y="720" fill="#111" font-size="18">• Стемминг (усечение) vs Лемматизация (словарная форма)</text>
  
  <!-- Блок 4: Векторное представление -->
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect3">
  <rect x="50" y="760" width="1100" height="250" rx="8" fill="#bbb" stroke="#666" stroke-width="2"/>
  <text x="70" y="795" fill="#000" font-size="24" font-weight="bold">3. Векторное представление текстов</text>
</a>  
  <!-- Подблок TF-IDF -->
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect3.1">
  <rect x="70" y="815" width="500" height="180" rx="6" fill="#aaa" stroke="#555" stroke-width="1.5"/>
  <text x="85" y="845" fill="#000" font-size="22" font-weight="bold">TF-IDF</text>
  </a>
  <text x="85" y="875" fill="#111" font-size="17">• Частота термина в документе (TF)</text>
  <text x="85" y="900" fill="#111" font-size="17">• Обратная частота документа (IDF)</text>
  <text x="85" y="925" fill="#111" font-size="17">• Преимущества: простота, интерпретируемость</text>
  <text x="85" y="950" fill="#111" font-size="17">• Ограничения: игнорирует порядок и контекст</text>
  <text x="85" y="975" fill="#111" font-size="17">• Высокая размерность, разреженные векторы</text>
  
  <!-- Подблок Эмбеддинги -->
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect3.2">
  <rect x="600" y="815" width="530" height="180" rx="6" fill="#aaa" stroke="#555" stroke-width="1.5"/>
  <text x="615" y="845" fill="#000" font-size="22" font-weight="bold">Эмбеддинги (Embeddings)</text>
  </a>
  <text x="615" y="875" fill="#111" font-size="17">• Плотные векторные представления</text>
  <text x="615" y="900" fill="#111" font-size="17">• Статические: Word2Vec, GloVe, FastText</text>
  <text x="615" y="925" fill="#111" font-size="17">• Контекстуальные: BERT и производные</text>
  <text x="615" y="950" fill="#111" font-size="17">• Отражают семантическую близость</text>
  <text x="615" y="975" fill="#111" font-size="17">• Компактность, переносимость знаний</text>
  
  <!-- Блок 5: Классификация текстов -->
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect4">
  <rect x="50" y="1030" width="1100" height="190" rx="8" fill="#a8a8a8" stroke="#666" stroke-width="2"/>
  <text x="70" y="1065" fill="#000" font-size="24" font-weight="bold">4. Классификация текстов</text>
  </a>
  <text x="70" y="1100" fill="#111" font-size="18">• Примеры: фильтрация спама, анализ тональности, категоризация обращений</text>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect4.1">
  <rect x="70" y="1115" width="340" height="90" rx="5" fill="#999" stroke="#444" stroke-width="1.5"/>
  <text x="85" y="1145" fill="#000" font-size="20" font-weight="bold">Классические методы</text>
  </a>
  <text x="85" y="1170" fill="#111" font-size="16">Наивный Байес, Логистическая</text>
  <text x="85" y="1190" fill="#111" font-size="16">регрессия, SVM, Деревья решений</text>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect4.2">
  <rect x="430" y="1115" width="340" height="90" rx="5" fill="#999" stroke="#444" stroke-width="1.5"/>
  <text x="445" y="1145" fill="#000" font-size="20" font-weight="bold">Нейросетевые методы</text>
  </a>
  <text x="445" y="1170" fill="#111" font-size="16">Свёрточные и рекуррентные</text>
  <text x="445" y="1190" fill="#111" font-size="16">сети, Трансформеры</text>
  <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect4.3">
  <rect x="790" y="1115" width="340" height="90" rx="5" fill="#999" stroke="#444" stroke-width="1.5"/>
  <text x="805" y="1145" fill="#000" font-size="20" font-weight="bold">Метрики оценки</text>
  </a>
  <text x="805" y="1170" fill="#111" font-size="16">Accuracy, Precision, Recall,</text>
  <text x="805" y="1190" fill="#111" font-size="16">F1-мера, ROC-AUC, CM</text>
  
  <!-- Блок 6: Тематическое моделирование -->
  <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect5">
  <rect x="50" y="1240" width="530" height="170" rx="8" fill="#999" stroke="#666" stroke-width="2"/>
  <text x="70" y="1275" fill="#000" font-size="24" font-weight="bold">5. Тематическое моделирование</text>
  </a>
  <text x="70" y="1310" fill="#111" font-size="18">• Выявление скрытых тем в коллекции</text>
  <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect5.1">
  <text x="70" y="1340" fill="#111" font-size="18">• LDA (Latent Dirichlet Allocation)</text>
  </a>
  <text x="70" y="1370" fill="#111" font-size="18">• Документ = смесь тем</text>
  <text x="70" y="1395" fill="#111" font-size="18">• Тема = распределение вероятностей по словам</text>
  
  <!-- Блок 7: NER -->
  <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect6">
  <rect x="610" y="1240" width="540" height="170" rx="8" fill="#999" stroke="#666" stroke-width="2"/>
  <text x="630" y="1275" fill="#000" font-size="24" font-weight="bold">6. Извлечение сущностей (NER)</text>
  </a>
  <text x="630" y="1310" fill="#111" font-size="18">• Лица, организации, геообъекты, даты</text>
  <text x="630" y="1340" fill="#111" font-size="18">• Правила и словари → Статистика → Нейросети</text>
  <text x="630" y="1370" fill="#111" font-size="18">• Современные решения: трансформеры (BERT)</text>
  <text x="630" y="1395" fill="#111" font-size="18">• Превращение текста в структурированные данные</text>
  
  <!-- Блок 8: Выводы -->
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter10.md#sect7">
  <rect x="50" y="1430" width="1100" height="140" rx="8" fill="#777" stroke="#444" stroke-width="2"/>
  <text x="70" y="1465" fill="#fff" font-size="24" font-weight="bold">Выводы</text>
  </a>
  <text x="70" y="1500" fill="#f0f0f0" font-size="18">• Текстовая аналитика — ключевой инструмент извлечения знаний из неструктурированной информации</text>
  <text x="70" y="1530" fill="#f0f0f0" font-size="18">• Предобработка, TF-IDF и эмбеддинги создают основу для численного анализа текстов</text>
  <text x="70" y="1560" fill="#f0f0f0" font-size="18">• Классификация, тематическое моделирование и NER покрывают широкий спектр прикладных задач</text>
  
</svg>