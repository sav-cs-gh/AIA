<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" font-family="Arial, Helvetica, sans-serif">
  
  <!-- Общий фон -->
  <rect width="1200" height="1600" fill="#f0f0f0"/>
  
  <!-- ==================== ЗАГОЛОВОК ==================== -->
  <rect x="30" y="15" width="1140" height="100" rx="12" fill="#2a2a2a"/>
  <text x="600" y="55" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff">Глава 8. Анализ временных рядов</text>
  <text x="600" y="92" text-anchor="middle" font-size="26" fill="#cccccc">в интеллектуальном анализе данных</text>
  
  <!-- ==================== БЛОК 1: Понятие ==================== -->
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect1">
  <rect x="30" y="125" width="555" height="300" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="30" y="125" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="30" y="157" width="555" height="18" fill="#4a4a4a"/>
  <text x="307" y="158" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">1. Понятие временного ряда</text>
  </a>
  <text x="50" y="205" font-size="18" font-weight="bold" fill="#1a1a1a">Определение:</text>
  <text x="50" y="232" font-size="16" fill="#2a2a2a">Последовательность наблюдений,</text>
  <text x="50" y="256" font-size="16" fill="#2a2a2a">упорядоченная во времени</text>
  
  <text x="50" y="293" font-size="18" font-weight="bold" fill="#1a1a1a">Ключевые особенности:</text>
  <text x="65" y="320" font-size="15" fill="#333">• Упорядоченность наблюдений</text>
  <text x="65" y="343" font-size="15" fill="#333">• Автокорреляция</text>
  <text x="65" y="366" font-size="15" fill="#333">• Тренд, сезонность, цикличность</text>
  <text x="65" y="389" font-size="15" fill="#333">• Нестационарность</text>
  <text x="65" y="412" font-size="15" fill="#333">• Шум и случайные колебания</text>
  
  <!-- ==================== БЛОК 2: Задачи ==================== -->
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect2">
  <rect x="615" y="125" width="555" height="300" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="615" y="125" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="615" y="157" width="555" height="18" fill="#4a4a4a"/>
  <text x="892" y="158" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">2. Базовые задачи</text>
  </a>
  <text x="635" y="205" font-size="18" font-weight="bold" fill="#1a1a1a">Основные задачи:</text>
  <text x="650" y="232" font-size="16" fill="#333">• Прогнозирование (Forecasting)</text>
  <text x="650" y="258" font-size="16" fill="#333">• Декомпозиция ряда</text>
  <text x="650" y="284" font-size="16" fill="#333">• Обнаружение аномалий</text>
  <text x="650" y="310" font-size="16" fill="#333">• Классификация рядов</text>
  <text x="650" y="336" font-size="16" fill="#333">• Кластеризация рядов</text>
  <text x="650" y="362" font-size="16" fill="#333">• Поиск мотивов</text>
  <text x="650" y="388" font-size="16" fill="#333">• Причинно-следственный анализ</text>
  
  <!-- ==================== БЛОК 3: Структура ==================== -->
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect3">
  <rect x="30" y="445" width="555" height="330" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="30" y="445" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="30" y="477" width="555" height="18" fill="#4a4a4a"/>
  <text x="307" y="478" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">3. Структура ряда</text>
  </a>
  <text x="50" y="535" font-size="18" font-weight="bold" fill="#1a1a1a">Компоненты:</text>
 <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect3.1">  
  <rect x="65" y="550" width="200" height="45" rx="6" fill="#c8c8c8" stroke="#666" stroke-width="1.5"/>
  <text x="165" y="588" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Тренд</text>
  </a>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect3.2">
  <rect x="285" y="550" width="200" height="45" rx="6" fill="#c8c8c8" stroke="#666" stroke-width="1.5"/>
  <text x="385" y="588" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Сезонность</text>
  </a>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect3.3">
  <rect x="65" y="610" width="200" height="45" rx="6" fill="#c8c8c8" stroke="#666" stroke-width="1.5"/>
  <text x="165" y="638" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Цикл</text>
  </a>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect3.4">
  <rect x="285" y="610" width="200" height="45" rx="6" fill="#c8c8c8" stroke="#666" stroke-width="1.5"/>
  <text x="385" y="638" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Шум</text>
  </a>
  <text x="50" y="685" font-size="18" font-weight="bold" fill="#1a1a1a">Модели:</text>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect3.5">
  <text x="65" y="712" font-size="16" fill="#333">Аддитивная: Y = T + S + C + E</text>
  </a>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect3.6">
  <text x="65" y="736" font-size="16" fill="#333">Мультипликативная: Y = T × S × C × E</text>
  </a>
  <!-- ==================== БЛОК 4: Стационарность ==================== -->
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect4">
  <rect x="615" y="445" width="555" height="330" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="615" y="445" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="615" y="477" width="555" height="18" fill="#4a4a4a"/>
  <text x="892" y="478" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">4. Стационарность</text>
  </a>
  <text x="635" y="535" font-size="18" font-weight="bold" fill="#1a1a1a">Определение:</text>
  <text x="650" y="562" font-size="16" fill="#2a2a2a">Статистические характеристики</text>
  <text x="650" y="593" font-size="16" fill="#2a2a2a">не изменяются во времени</text>
  
  <text x="635" y="620" font-size="18" font-weight="bold" fill="#1a1a1a">Признаки стационарности:</text>
  <text x="650" y="647" font-size="16" fill="#333">• Постоянное среднее</text>
  <text x="650" y="674" font-size="16" fill="#333">• Постоянная дисперсия</text>
  <text x="650" y="701" font-size="16" fill="#333">• Ковариация только от лага</text>
  
  <text x="635" y="738" font-size="18" font-weight="bold" fill="#1a1a1a">Преобразования:</text>
  <text x="650" y="765" font-size="16" fill="#333">Дифференцирование, логарифмирование</text>
  
  <!-- ==================== БЛОК 5: Модели ==================== -->
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect5">
  <rect x="30" y="795" width="555" height="280" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="30" y="795" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="30" y="827" width="555" height="18" fill="#4a4a4a"/>
  <text x="307" y="828" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">5. Модели прогнозирования</text>
 </a> 
  <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect5.1">
  <text x="50" y="865" font-size="17" font-weight="bold" fill="#1a1a1a">Наивная модель:</text>
  </a>
  <text x="65" y="890" font-size="16" fill="#333">ŷ(t+1) = y(t)</text>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect5.2">
  <text x="50" y="922" font-size="17" font-weight="bold" fill="#1a1a1a">Сезонная наивная:</text>
  </a>
  <text x="65" y="947" font-size="16" fill="#333">ŷ(t+h) = y(t+h-m)</text>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect5.3">
  <text x="50" y="979" font-size="17" font-weight="bold" fill="#1a1a1a">Скользящее среднее:</text>
  </a
  <text x="65" y="1004" font-size="16" fill="#333">ŷ(t+1) = среднее за k периодов</text>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect5.4">
  <text x="50" y="1036" font-size="17" font-weight="bold" fill="#1a1a1a">Экспоненциальное сглаживание:</text>
  </a>
  <text x="65" y="1063" font-size="16" fill="#333">ŷ(t+1) = α·y(t) + (1-α)·ŷ(t)</text>
  
  <!-- ==================== БЛОК 6: ARIMA ==================== -->
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect6">
  <rect x="615" y="795" width="555" height="280" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="615" y="795" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="615" y="827" width="555" height="18" fill="#4a4a4a"/>
  <text x="892" y="828" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">6. ARIMA / SARIMA</text>
  </a>
  <text x="635" y="865" font-size="18" font-weight="bold" fill="#1a1a1a">ARIMA(p,d,q):</text>
  <text x="650" y="892" font-size="16" fill="#333">• p — порядок авторегрессии</text>
  <text x="650" y="918" font-size="16" fill="#333">• d — порядок дифференцирования</text>
  <text x="650" y="944" font-size="16" fill="#333">• q — порядок скользящего среднего</text>
  <text x="635" y="985" font-size="18" font-weight="bold" fill="#1a1a1a">Выбор параметров:</text>
  <text x="650" y="1012" font-size="16" fill="#333">• ACF (автокорреляционная функция)</text>
  <text x="650" y="1038" font-size="16" fill="#333">• PACF (частная автокорреляция)</text>
  <text x="650" y="1064" font-size="16" fill="#333">• AIC / BIC информационные критерии</text>
  
  <!-- ==================== БЛОК 7: Оценка качества ==================== -->
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect6.2">
  <rect x="30" y="1105" width="555" height="285" rx="10" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <rect x="30" y="1105" width="555" height="50" rx="10" fill="#4a4a4a"/>
  <rect x="30" y="1137" width="555" height="18" fill="#4a4a4a"/>
  <text x="307" y="1138" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">7. Оценка качества прогноза</text>
  </a>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect6.2">
  <text x="50" y="1175" font-size="18" font-weight="bold" fill="#1a1a1a">Метрики:</text>
  <text x="65" y="1205" font-size="16" fill="#333">• MAE — средняя абсолютная ошибка</text>
  </a>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect6.3">
  <text x="65" y="1232" font-size="16" fill="#333">• MSE — средняя квадратичная ошибка</text>
  </a>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect6.8">
  <text x="65" y="1259" font-size="16" fill="#333">• RMSE — корень из MSE</text>
  </a>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect6.9">
  <text x="65" y="1286" font-size="16" fill="#333">• MAPE — средняя % ошибка</text>
  </a>
  <text x="50" y="1325" font-size="18" font-weight="bold" fill="#1a1a1a">Типы прогнозов:</text>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect6.10">
  <text x="65" y="1352" font-size="16" fill="#333">• Точечный прогноз (одно значение)</text>
  </a>
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect6.11">
  <text x="65" y="1379" font-size="16" fill="#333">• Интервальный (диапазон с доверием)</text>
  
  <!-- ==================== БЛОК 8: Рекомендации ==================== -->
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect7">
  <rect x="615" y="1105" width="555" height="285" rx="10" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
  <rect x="615" y="1105" width="555" height="50" rx="10" fill="#3a3a3a"/>
  <rect x="615" y="1137" width="555" height="18" fill="#3a3a3a"/>
  <text x="892" y="1138" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">8. Практические рекомендации</text>
  </a>
  <text x="635" y="1175" font-size="16" fill="#1a1a1a">1. Всегда начинайте с визуализации</text>
  <text x="635" y="1205" font-size="16" fill="#1a1a1a">2. Проверяйте частоту и пропуски</text>
  <text x="635" y="1232" font-size="16" fill="#1a1a1a">3. Учитывайте календарные эффекты</text>
  <text x="635" y="1259" font-size="16" fill="#1a1a1a">4. Не перемешивайте наблюдения</text>
  <text x="635" y="1286" font-size="16" fill="#1a1a1a">5. Сравнивайте с простыми моделями</text>
  <text x="635" y="1313" font-size="16" fill="#1a1a1a">6. Анализируйте остатки</text>
  <text x="635" y="1340" font-size="16" fill="#1a1a1a">7. Используйте интервальные прогнозы</text>
  <text x="635" y="1367" font-size="16" fill="#1a1a1a">8. Интерпретируйте в контексте</text>
  
  <!-- ==================== ВЫВОД ==================== -->
   <a href="https://github.com/sav-cs-gh/AIA/blob/main/chapters/Chapter8.md#sect8">
  <rect x="30" y="1415" width="1140" height="80" rx="10" fill="#2a2a2a"/>
  <text x="600" y="1448" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Вывод: Анализ временных рядов — ключевой инструмент прогнозирования</text>
  </a>
  <text x="600" y="1480" text-anchor="middle" font-size="20" fill="#bbbbbb">динамики процессов, поддержки решений и предиктивной аналитики</text>
  
</svg>